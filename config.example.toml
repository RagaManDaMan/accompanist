# Copy to config.toml and edit. Run `accompanist devices` to see your port names.
# Channels are 1-16, as in Logic. `accompanist params` lists every setting.

# Optional: start from a preset (see `accompanist params` for the list). Anything
# you set below overrides it. `--preset NAME` on the command line wins over this.
# preset = "ambient"

[output]
# Default: create a virtual MIDI source called "Accompanist". Logic should list it
# as a MIDI input automatically, with no IAC setup.
virtual_name = "Accompanist"
# Or send to a port that already exists (this replaces the virtual one):
# port = "IAC Driver Bus 1"

# One block per input. V0 supports role = "note_source" (discrete MIDI notes:
# EWI, keyboard, MIDI guitar). Audio roles (voice, lap steel) come later.
[[inputs]]
name = "wind"
port = "EWI"            # any distinctive part of the port name
role = "note_source"
# channel = 1           # omit to listen on all channels

[tempo]
initial_bpm = 70        # the reading before there is enough playing (8 notes) to go on
prior_bpm = 80          # chooses the beat "octave": 80 reads a 120 melody as 60. Fast pieces: 110
min_bpm = 40
max_bpm = 180
window_s = 30           # how much recent playing the estimate listens to
halflife_s = 12         # older notes count less: their weight halves every this many seconds
alpha = 0.25            # higher = follows you faster, but jumpier

[harmony]
model = "drone"         # "drone" (root + fifth) or "modal" (chords from a key, following you)
root = "auto"           # or lock the tonic, e.g. "D" (recommended for a fixed-Sa piece)
half_life_s = 12        # how long it remembers what you played (modal: decides the key)
# modal only:
# mode = "auto"         # "major", "minor" (raised 7th), "chromatic" (any chord), "auto"
# color = 0.5           # 0 = plain triads ... 1 = 7ths, add9, sus, dim freely
# chord_memory_s = 4    # the chord follows about this much of your playing

[pad]                   # slow atmospheric harmony
enabled = true
channel = 1
octave = 3
velocity = 55
lag_beats = 4           # deliberate delay before following a harmonic change
min_change_beats = 8

[pulse]                 # soft note on every beat, tempo-locked
enabled = true
channel = 2             # different channel so Logic can route it to another track
octave = 2
velocity = 45
accent = 25             # extra velocity on the first beat of each bar
beats_per_bar = 4
min_confidence = 0.5    # start pulsing once the tempo is this clear...
stop_confidence = 0.15  # ...and only stop again if it falls below this

[dynamics]              # the accompaniment breathes with you: see README
follow = 0.5            # 0 = fixed levels; 1 = pad and bass follow your loudness fully
duck = 0.5              # how far the pad steps back while you play busily
pad_floor = 0.25        # never quieter than this

[lock]                  # tempo lock (chords are held separately, key c): see README
auto = true             # lock by itself once the tempo has been clear for a while
# confidence = 0.8
# after_s = 25

[controls]
# Optional: map MIDI controller numbers (from any input) to actions or settings.
# Actions (panic, resume, tap_tempo) fire when the value is >= 64, e.g. a foot switch.
# Settings follow the controller across their range, e.g. a knob on pad.velocity.
# 85 = "panic"
# 86 = "tap_tempo"
# 87 = "lock"           # tempo
# 88 = "unlock"
# 89 = "chord_toggle"   # hold / release the current chord
# 7 = "pad.velocity"
# 20 = "harmony.color"
# 22 = "harmony.mode"
# 21 = "tempo.prior_bpm"
