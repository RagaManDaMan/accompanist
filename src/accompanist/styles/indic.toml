# An Indian fusion piece (its key is a rāga, or its time a tāla): the percussion, your
# mridangam or tabla, plays nearly all the time and steps forward in the gaps, instead of
# coming and going in spells. Taken automatically for such a piece, under your own
# settings (config.toml or the song file win); or choose it by name like any style.
[percussion]
enabled = true
presence = 0.85
spell_bars = 8
spotlight = 0.5
triplets = 0.6
moras = 0.12           # now and then a mōrā marks the sam

[pulse]
movement = 1.0         # the harmony moves little in a rāga: the bass moves more,
shape_bars = 1         # a new shape every bar, through the rāga's swaras

[ending]
shape = "mora"         # f: the percussion lands the song on the sam with a mōrā (tihai)
