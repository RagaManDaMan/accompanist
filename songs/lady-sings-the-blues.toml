# Lady Sings The Blues (Herbie Nichols / Billie Holiday): a jazz ballad from the chart,
# AABA in F minor / F major. The band follows the chart's changes exactly.
# MainStage patch 2.

[song]
title = "Lady Sings The Blues"
tempo = 66               # a ballad; change to taste (s counts in at this)
count = 4
patch = 2

[harmony]
model = "chart"
chart = "../charts/Lady Sings The Blues.musicxml"

[drums]
enabled = true
style = "jazz"           # real jazz drummers' grooves (the groove library); else:
pattern = "swing"        # the swing pattern
swing = 0.33

[percussion]
enabled = true           # MainStage patch 2: "Blocks & Bells", a tuned (pitched) sound...
tuned = true             # ...so it plays the chart's chord tones, not fixed drum notes

[piano]
enabled = true
comp = 0.5               # comps behind you, jazz style
voicing = "rootless"

[response]
enabled = true

[ending]
shape = "ritardando"     # a ballad slows into its last chord
